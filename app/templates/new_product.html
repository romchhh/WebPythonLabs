{% extends "base.html" %}

{% block title %}Додати новий товар{% endblock %}

{% block content %}
<div class="breadcrumbs">
    <a href="/products">Товари</a>
    <span class="separator">/</span>
    <span>Додати новий товар</span>
</div>

<div class="form-container animate-in">
    <h1 class="section-title">Додати новий товар</h1>
    
    <form method="POST" action="/products/new" enctype="multipart/form-data">
        <div class="form-group">
            <label for="name">Назва товару</label>
            <input type="text" id="name" name="name" required placeholder="Введіть назву товару">
        </div>
        
        <div class="form-group">
            <label for="description">Опис</label>
            <textarea id="description" name="description" required rows="5" placeholder="Детальний опис товару"></textarea>
        </div>
        
        <div class="form-group">
            <label for="category">Категорія</label>
            <select id="category" name="category" required>
                <option value="" disabled selected>Оберіть категорію</option>
                <option value="electronics">Електроніка</option>
                <option value="clothing">Одяг</option>
                <option value="books">Книги</option>
                <option value="home">Товари для дому</option>
                <option value="sport">Спорт та відпочинок</option>
                <option value="beauty">Краса та здоров'я</option>
                <option value="food">Їжа та напої</option>
                <option value="other">Інше</option>
            </select>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="price">Ціна (грн)</label>
                <input type="number" id="price" name="price" step="0.01" min="0" required placeholder="0.00">
            </div>
            
            <div class="form-group">
                <label for="stock">Кількість на складі</label>
                <input type="number" id="stock" name="stock" min="0" required placeholder="0">
            </div>
        </div>
        
        <div class="form-group">
            <label for="image_url">Зображення (URL)</label>
            <input type="url" id="image_url" name="image_url" placeholder="https://example.com/image.jpg">
            <small>Введіть URL зображення товару (опціонально)</small>
        </div>
        
        <div class="form-footer">
            <a href="/products" class="btn btn-outline">Скасувати</a>
            <button type="submit" class="btn btn-accent">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                Додати товар
            </button>
        </div>
    </form>
</div>

<style>
.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.5rem;
}

@media (max-width: 600px) {
    .form-row {
        grid-template-columns: 1fr;
    }
}

small {
    display: block;
    margin-top: 0.5rem;
    color: var(--text-light);
    font-size: 0.85rem;
}
</style>
{% endblock %}
