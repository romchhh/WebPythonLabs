{% extends "base.html" %}

{% block title %}Редагувати товар{% endblock %}

{% block content %}
<div class="breadcrumbs">
    <a href="/products">Товари</a>
    <span class="separator">/</span>
    <span>Редагувати товар</span>
</div>

<div class="form-container animate-in">
    <h1 class="section-title">Редагувати товар</h1>
    
    <form method="POST" action="/products/{{ product.id }}/edit" enctype="multipart/form-data">
        <div class="form-group">
            <label for="name">Назва товару</label>
            <input type="text" id="name" name="name" value="{{ product.name }}" required placeholder="Введіть назву товару">
        </div>
        
        <div class="form-group">
            <label for="description">Опис</label>
            <textarea id="description" name="description" required rows="5" placeholder="Детальний опис товару">{{ product.description }}</textarea>
        </div>
        
        <div class="form-group">
            <label for="category">Категорія</label>
            <select id="category" name="category" required>
                <option value="" disabled {% if not product.category %}selected{% endif %}>Оберіть категорію</option>
                <option value="electronics" {% if product.category == "electronics" %}selected{% endif %}>Електроніка</option>
                <option value="clothing" {% if product.category == "clothing" %}selected{% endif %}>Одяг</option>
                <option value="books" {% if product.category == "books" %}selected{% endif %}>Книги</option>
                <option value="home" {% if product.category == "home" %}selected{% endif %}>Товари для дому</option>
                <option value="sport" {% if product.category == "sport" %}selected{% endif %}>Спорт та відпочинок</option>
                <option value="beauty" {% if product.category == "beauty" %}selected{% endif %}>Краса та здоров'я</option>
                <option value="food" {% if product.category == "food" %}selected{% endif %}>Їжа та напої</option>
                <option value="other" {% if product.category == "other" %}selected{% endif %}>Інше</option>
            </select>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="price">Ціна (грн)</label>
                <input type="number" id="price" name="price" step="0.01" min="0" value="{{ product.price }}" required placeholder="0.00">
            </div>
            
            <div class="form-group">
                <label for="stock">Кількість на складі</label>
                <input type="number" id="stock" name="stock" min="0" value="{{ product.stock }}" required placeholder="0">
            </div>
        </div>
        
        <div class="form-group">
            <label for="image_url">Зображення (URL)</label>
            <input type="url" id="image_url" name="image_url" value="{{ product.image_url if product.image_url else '' }}" placeholder="https://example.com/image.jpg">
            <small>Введіть URL зображення товару (опціонально)</small>
        </div>
        
        <div class="form-footer">
            <a href="/products" class="btn btn-outline">Скасувати</a>
            <button type="submit" class="btn btn-accent">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                    <polyline points="17 21 17 13 7 13 7 21"></polyline>
                    <polyline points="7 3 7 8 15 8"></polyline>
                </svg>
                Зберегти зміни
            </button>
        </div>
    </form>
</div>

<style>
.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.5rem;
}

@media (max-width: 600px) {
    .form-row {
        grid-template-columns: 1fr;
    }
}

small {
    display: block;
    margin-top: 0.5rem;
    color: var(--text-light);
    font-size: 0.85rem;
}
</style>
{% endblock %}
