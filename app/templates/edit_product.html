{% extends "base.html" %}

{% block title %}Редагувати продукт{% endblock %}

{% block content %}
<div class="form-container">
    <h1>Редагувати продукт</h1>
    <form method="POST" action="/products/{{ product.id }}/edit">
        <div class="form-group">
            <label for="name">Назва:</label>
            <input type="text" id="name" name="name" value="{{ product.name }}" required>
        </div>
        
        <div class="form-group">
            <label for="description">Опис:</label>
            <textarea id="description" name="description" required>{{ product.description }}</textarea>
        </div>
        
        <div class="form-group">
            <label for="price">Ціна:</label>
            <input type="number" id="price" name="price" step="0.01" value="{{ product.price }}" required>
        </div>
        
        <div class="form-group">
            <label for="stock">Кількість на складі:</label>
            <input type="number" id="stock" name="stock" value="{{ product.stock }}" required>
        </div>
        
        <button type="submit" class="btn-primary">Зберегти зміни</button>
    </form>
</div>
{% endblock %}
